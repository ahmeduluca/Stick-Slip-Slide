core:
  tip_radius_um: 5.0
  k_frame_z: 450000.0
  k_frame_x: 200000.0
  pattern: "*.csv"
  outdir: "results"

touch:
  k_touch_min: 500.0
  k_touch_min_duration_s: 0.1
  loading_rate_threshold: 0.001
  normal_load_sustain: 0.5
  normal_load_smooth: 201

cycles:
  smooth_n: 501
  dynF2_baseline_q: 0.05
  dynF2_active_delta: 0.03
  dynF2_nearzero_delta: 0.01
  hold_top_frac: 0.98
  hold_min_s: 0.2
  min_cycle_points: 200
  dfdt_smooth_n: 301
  dfdt_thr_frac: 0.001
  dfdt_hold_frac: 0.9
  min_ramp_s: 2.0
  min_hold_s: 0.5
  expected_cycles: 3

transition:
  trans_frac_up: 0.1
  trans_frac_down: 0.15
  sliding_lateral_stiffness_thresh: 500.0
  resticking_lateral_stiffness_thresh: 1000.0
  trans_low_band: [0.05, 0.20]
  trans_smooth_n: 21

hertz:
  hertz_enable: true
  hardness_Pa: 1.0e10
  plasticity_p0_frac: 1.0
  hertz_min_h_m: 1.0e-9
  hertz_max_frac_of_Pmax: 1.0
  hertz_min_points: 50
  hertz_iter: 3
  hertz_plot: true
  area_mode: "nominal"

materials:
  E1_GPa: 70.0
  nu1: 0.18
  E2_GPa: 1140.0
  nu2: 0.07

adhesion:
  adhesion_model: "auto"
  w_J_per_m2: 0.5
  sigma_rms_m: 0.5e-9
  rough_model: "exp"
  delta0_m: 0.3e-9
  z0_m: 0.3e-9
  mu_dmt: 1.0
  mu_jkr: 5.0
  min_h_m: 1.0e-10
  max_frac_of_Pmax: 1.0
  min_points: 10
  n_iter: 100

plotting:
  manual_mode: "on_fail"
  manual_cycle_mode: "always"
  plot_mindlin: true
  plot_cycles: true
  live_plots: true
  plot_every: 1
  summary_plots: true
  origin_csv: true
  summary_template: true
